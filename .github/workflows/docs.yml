name: Docs

on:
  push:
    branches: [main, develop]
    paths: ["mkdocs.yml", "docs/**"]
  pull_request:
    branches: [main, develop]
    paths: ["mkdocs.yml", "docs/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install --no-cache-dir -r requirements.txt

      - run: mkdocs build --strict
